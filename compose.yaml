# Local Postgres for development and the db test suite.
# Port 5434 so it does not collide with other local Postgres instances.
name: nummo

services:
  postgres:
    image: postgres:18-alpine
    container_name: nummo_postgres
    environment:
      POSTGRES_USER: nummo
      POSTGRES_PASSWORD: nummo
      POSTGRES_DB: nummo
    ports:
      - "5434:5432"
    volumes:
      - nummo_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nummo -d nummo"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  nummo_pg:
